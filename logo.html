document.fonts.ready.then(()=>{layout();setT(0);window.ready=true;(function(){const DUR=6.5,HOLD=1.8;let t0=performance.now(),paused=false,tp=0; const root=document.getElementById('root'); function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);root.style.transform=`translate(-50%,-50%) scale(${k})`} addEventListener('resize',fit);fit(); function loop(now){if(!paused){let t=((now-t0)/1000)%(DUR+HOLD);setT(Math.min(t,DUR));tp=t}requestAnimationFrame(loop)} function toggle(){if(paused){t0=performance.now()-tp*1000;paused=false}else paused=true} root.addEventListener('click',()=>{t0=performance.now();paused=false}); addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}}); requestAnimationFrame(loop)})();});
